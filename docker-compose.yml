services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aurora-pos-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./vendor:/var/www/html/vendor
      - ./node_modules:/var/www/html/node_modules
    ports:
      - "8000:8000"
    depends_on:
      - mysql
    environment:
      - APP_ENV=local
      - APP_DEBUG=true

  mysql:
    image: mysql:8.0
    container_name: aurora-pos-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: aurora_pos
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
      MYSQL_USER: aurora
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  node:
    image: node:22
    container_name: aurora-pos-node
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: npm run dev
    ports:
      - "5173:5173"
    depends_on:
      - app

volumes:
  mysql_data:
